model:
  name: "CNN-ConvNeXt-Tiny-Baseline"
  num_classes: 80
  pretrained_backbone: true
data:
  dataset: "coco2017"
  train_dir: "datasets/coco/train2017"
  train_ann: "datasets/coco/annotations/instances_train2017.json"
  val_dir: "datasets/coco/val2017"
  val_ann: "datasets/coco/annotations/instances_val2017.json"
  image_size: 640
  batch_size: 2
training:
  seed: 42
  optimizer: "AdamW"
  lr: 0.0001
  scheduler: "CosineAnnealing"
  epochs: 12
  augmentation: "standard_coco"
  mixed_precision: true
  output_dir: "checkpoints/cnn_baseline"
